# ─────────────────────────────────────────────
# Netlify configuration for Whizzly Lab
# Next.js 16 · Turbopack · App Router
# ─────────────────────────────────────────────

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"
  NEXT_PUBLIC_APP_URL = "https://whizzlylab.netlify.app"

# ─── Next.js Plugin ───────────────────────────
# Handles prerendering, ISR, image optimization,
# and rewrites so the app works perfectly on Netlify.
[[plugins]]
  package = "@netlify/plugin-nextjs"

# ─── Image Optimization ──────────────────────
# Cache images aggressively; Netlify image CDN serves them.
[[headers]]
  for = "/_next/image*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Access-Control-Allow-Origin = "*"

# ─── Static Assets (fonts, logos, favicon) ───
# Long-term cache — these never change.
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/logo-*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/icon*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ─── Sitemap & Robots ────────────────────────
# Must be served with correct MIME types.
[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "text/xml; charset=utf-8"
    Cache-Control = "public, max-age=43200"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Cache-Control = "public, max-age=86400"

# ─── PWA Manifest ───────────────────────────
[[headers]]
  for = "/manifest.json"
  [headers.values]
    Content-Type = "application/manifest+json; charset=utf-8"
    Cache-Control = "public, max-age=86400"

# ─── Security Headers (all pages) ────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    X-DNS-Prefetch-Control = "on"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-eval' https://assets.netlify.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://db.onlinewebfonts.com; img-src 'self' data: https: https://images.unsplash.com; font-src 'self' https://fonts.gstatic.com https://db.onlinewebfonts.com; connect-src 'self' https://api.web3forms.com https://api.fontshare.com; frame-src 'none'; base-uri 'self'; form-action 'self' https://api.web3forms.com"

# ─── Netlify Identity (optional — uncomment if using) ───
